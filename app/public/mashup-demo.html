<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Demo retired | Mashups</title>
  <style>
    :root { color-scheme: light; --paper: #f2efe5; --ink: #13130f; --signal: #ff4f1f; --acid: #d7ff3f; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: var(--ink); background: var(--paper); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    main { width: min(720px, 100%); border: 1px solid var(--ink); background: #fbf8ef; box-shadow: 10px 10px 0 var(--ink); }
    header { padding: 14px 18px; border-bottom: 1px solid var(--ink); background: var(--acid); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    section { padding: clamp(28px, 7vw, 64px); }
    h1 { max-width: 560px; margin: 0; font-family: Impact, Haettenschweiler, sans-serif; font-size: clamp(48px, 11vw, 96px); letter-spacing: -.04em; line-height: .82; text-transform: uppercase; }
    h1 span { color: var(--signal); }
    p { max-width: 570px; margin: 28px 0; font-family: Georgia, serif; font-size: 18px; line-height: 1.55; }
    a { display: inline-block; padding: 14px 18px; border: 1px solid var(--ink); color: #fffaf0; background: var(--signal); box-shadow: 4px 4px 0 var(--ink); font-weight: 700; text-decoration: none; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <header>Mashups / safety reset</header>
    <section>
      <h1>That demo has been <span>retired.</span></h1>
      <p>It used music that is not part of the new green catalog. The rebuilt studio only uses Mashups originals and tracks with verified remix permission.</p>
      <a href="/create">Open the safe studio</a>
    </section>
  </main>
</body>
</html>
